
name: VIDHWAAN NEET — Daily AI Lesson

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vidhwaan-neet-daily-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate One NEET Lesson
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # NODE
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------
      # SYLLABUS VALIDATION
      # ------------------------------------------------------
      - name: Validate syllabus
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — SYLLABUS VALIDATION"
          echo "============================================================"

          npm run validate

      # ------------------------------------------------------
      # GROQ SECRET VALIDATION
      # ------------------------------------------------------
      - name: Validate Groq secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "ERROR: GROQ_API_KEY GitHub Secret is missing."
            exit 1
          fi

          case "$GROQ_API_KEY" in
            gsk_*)
              echo "GROQ_API_KEY configured."
              ;;
            *)
              echo "ERROR: Unexpected Groq key format."
              exit 1
              ;;
          esac

      # ------------------------------------------------------
      # GENERATE EXACTLY ONE DAY
      # ------------------------------------------------------
      - name: Generate next daily lesson
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — HINDI DAILY AI GENERATION"
          echo "============================================================"

          node generator/generate-day.js

      # ------------------------------------------------------
      # VERIFY GENERATED FILES
      # ------------------------------------------------------
      - name: Verify generated lesson
        run: |
          set -euo pipefail

          mkdir -p public/data

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          data_dir = Path("public/data")

          files = sorted(
              data_dir.glob("day-*.json"),
              key=lambda p: int(p.stem.split("-")[1])
          )

          if len(files) > 365:
              raise SystemExit(
                  f"ERROR: More than 365 lesson files exist: {len(files)}"
              )

          if not files:
              raise SystemExit(
                  "ERROR: No lesson files exist after generation."
              )

          hindi_pattern = re.compile(r"[\u0900-\u097F]")

          def require_hindi(value, label):
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(
                      f"ERROR: {label}: missing content."
                  )

              if not hindi_pattern.search(value):
                  raise SystemExit(
                      f"ERROR: {label}: Hindi Devanagari missing."
                  )

          expected = 1

          for f in files:
              match = re.fullmatch(r"day-(\d{3})", f.stem)

              if not match:
                  raise SystemExit(
                      f"ERROR: Invalid lesson filename: {f.name}"
                  )

              day = int(match.group(1))

              if day != expected:
                  raise SystemExit(
                      f"ERROR: Lesson sequence broken. "
                      f"Expected Day {expected}, found Day {day}"
                  )

              try:
                  content = json.loads(
                      f.read_text(encoding="utf-8")
                  )
              except Exception as e:
                  raise SystemExit(
                      f"ERROR: Invalid JSON in {f}: {e}"
                  )

              if int(content.get("day", 0)) != day:
                  raise SystemExit(
                      f"ERROR: {f}: day metadata mismatch."
                  )

              if not content.get("courseDate"):
                  raise SystemExit(
                      f"ERROR: {f}: missing courseDate."
                  )

              if not content.get("publishAt"):
                  raise SystemExit(
                      f"ERROR: {f}: missing publishAt."
                  )

              require_hindi(
                  content.get("title"),
                  f"{f.name}: title"
              )

              require_hindi(
                  content.get("introduction"),
                  f"{f.name}: introduction"
              )

              sections = content.get("sections")

              if not isinstance(sections, list) or not sections:
                  raise SystemExit(
                      f"ERROR: {f}: sections must be a non-empty array."
                  )

              outcomes = content.get("learningOutcome")

              if not isinstance(outcomes, list) or not outcomes:
                  raise SystemExit(
                      f"ERROR: {f}: learningOutcome must be a non-empty array."
                  )

              for i, outcome in enumerate(outcomes, 1):
                  require_hindi(
                      outcome,
                      f"{f.name}: learningOutcome {i}"
                  )

              for i, section in enumerate(sections, 1):
                  if not isinstance(section.get("topic"), str):
                      raise SystemExit(
                          f"ERROR: {f.name}: section {i} topic missing."
                      )

                  require_hindi(
                      section.get("heading"),
                      f"{f.name}: section {i} heading"
                  )

                  require_hindi(
                      section.get("content"),
                      f"{f.name}: section {i} content"
                  )

                  for field in ("keyPoints", "neetTips"):
                      values = section.get(field)

                      if not isinstance(values, list) or not values:
                          raise SystemExit(
                              f"ERROR: {f.name}: section {i} {field} missing."
                          )

                      for j, value in enumerate(values, 1):
                          require_hindi(
                              value,
                              f"{f.name}: section {i} {field} {j}"
                          )

              mcqs = content.get("mcqs")

              if not isinstance(mcqs, list) or not mcqs:
                  raise SystemExit(
                      f"ERROR: {f}: mcqs must be a non-empty array."
                  )

              for i, mcq in enumerate(mcqs, 1):
                  require_hindi(
                      mcq.get("question"),
                      f"{f.name}: MCQ {i} question"
                  )

                  require_hindi(
                      mcq.get("explanation"),
                      f"{f.name}: MCQ {i} explanation"
                  )

                  options = mcq.get("options")

                  if not isinstance(options, list) or len(options) != 4:
                      raise SystemExit(
                          f"ERROR: {f.name}: MCQ {i} must have 4 options."
                      )

                  if any(
                      not isinstance(option, str) or not option.strip()
                      for option in options
                  ):
                      raise SystemExit(
                          f"ERROR: {f.name}: MCQ {i} has an empty option."
                      )

                  answer = mcq.get("answer")

                  if (
                      not isinstance(answer, int)
                      or isinstance(answer, bool)
                      or answer < 0
                      or answer > 3
                  ):
                      raise SystemExit(
                          f"ERROR: {f.name}: MCQ {i} answer index invalid."
                      )

              expected += 1

          latest = files[-1]

          print(f"Lesson files : {len(files)}")
          print(f"Latest lesson: {latest.name}")
          print("Sequence     : VALID")
          print("JSON         : VALID")
          print("Hindi        : VALID")
          print("Content      : VALID")
          PY

      # ------------------------------------------------------
      # VERIFY GIT CHANGES
      # ------------------------------------------------------
      - name: Verify Git changes
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — GIT CHANGE VERIFICATION"
          echo "============================================================"

          git status --short

          CHANGED="$(git status --porcelain -- \
            'public/data/day-*.json' || true)"

          if [ -z "$CHANGED" ]; then
            echo "No new lesson file was generated."
            echo "Nothing to commit."
            exit 0
          fi

          echo "Generated lesson change:"
          echo "$CHANGED"

      # ------------------------------------------------------
      # COMMIT + PUSH
      # ------------------------------------------------------
      - name: Commit generated lesson
        run: |
          set -euo pipefail

          git add public/data/day-*.json

          if git diff --cached --quiet; then
            echo "No new lesson to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: generate daily NEET Hindi lesson"

          git push origin HEAD:main

          echo "============================================================"
          echo " DAILY HINDI LESSON COMMITTED SUCCESSFULLY"
          echo "============================================================"
